name: Bounded Source Intent installed consumer

on:
  pull_request:
  push:
    branches:
      - main
      - "kirchherr/**"

permissions:
  contents: read

concurrency:
  group: bounded-source-consumer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Build wheel with existing pinned toolchain
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip wheel --no-deps --no-build-isolation --no-index . --wheel-dir "$RUNNER_TEMP/bounded-source-wheel"
      - name: Install into separate environment and run outside checkout
        run: |
          set -euo pipefail
          unset PYTHONPATH
          python -m venv "$RUNNER_TEMP/bounded-source-env"
          "$RUNNER_TEMP/bounded-source-env/bin/python" -m pip install --require-hashes -r requirements/ci.txt
          "$RUNNER_TEMP/bounded-source-env/bin/python" -m pip install --no-deps --no-index "$RUNNER_TEMP"/bounded-source-wheel/tuc-*.whl
          cp -R integration/bounded_dag_compiler "$RUNNER_TEMP/bounded-source-consumer"
          cd "$RUNNER_TEMP/bounded-source-consumer"
          "$RUNNER_TEMP/bounded-source-env/bin/python" -I -c 'import os, pathlib, sys, tuc; root = pathlib.Path(sys.prefix).resolve(); assert pathlib.Path(tuc.__file__).resolve().is_relative_to(root); assert not any(pathlib.Path(p).resolve().is_relative_to(pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()) for p in sys.path if p)'
          "$RUNNER_TEMP/bounded-source-env/bin/python" -I consumer.py --check expected_report.json
