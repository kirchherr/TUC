name: Bounded C11 proof

on:
  pull_request:
  push:
    branches:
      - main
      - "kirchherr/**"

permissions:
  contents: read

concurrency:
  group: bounded-c11-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler-emitted-c11:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Install proof dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Verify deterministic C11 emission
        run: python examples/bounded_compiler_emitted_c11_emission.py
      - name: Build bounded compiler-emitted C11 worker
        run: >-
          docker compose --profile compiler-emitted-c11
          build --pull compiler-emitted-c11
      - name: Verify zero-call preflight
        run: python examples/bounded_compiler_emitted_c11_proof.py --preflight
      - name: Execute bounded static C11 proof
        run: python examples/bounded_compiler_emitted_c11_proof.py --execute
      - name: Verify accepted two-target aggregate
        run: python examples/bounded_compiler_target_equivalence_proof.py
      - name: Verify accepted source-to-target aggregate
        run: python examples/bounded_source_to_target_execution_proof.py
      - name: Execute second source program with reduction and wrong-code probes
        run: sh scripts/run_bounded_reduction_c11_proof.sh
      - name: Revalidate recorded physical reduction evidence (no GPU execution)
        run: |
          python examples/bounded_reduction_cuda.py --compare-record tests/golden/proofs/bounded_reduction_cuda_record.json
          pytest -q tests/test_bounded_reduction_cuda.py tests/test_bounded_reduction_c11.py
      - name: Execute twenty-vector C11 portfolio with sanitizers and wrong-code probes
        run: sh scripts/run_reduction_input_portfolio.sh --c11
      - name: Revalidate recorded two-target portfolio (no GPU execution)
        run: |
          python examples/reduction_input_portfolio.py --compare tests/golden/proofs/reduction_portfolio_c11_record.json tests/golden/proofs/reduction_portfolio_cuda_record.json
          pytest -q tests/test_reduction_input_portfolio.py
      - name: Execute odd-shape C11 reduction with sanitizers and coverage probes
        run: sh scripts/run_bounded_reduction_shapes.sh --c11
      - name: Revalidate recorded odd-shape equivalence (no GPU execution)
        run: |
          python examples/bounded_reduction_shapes.py --compare tests/golden/proofs/reduction_shape_c11_record.json tests/golden/proofs/reduction_shape_cuda_record.json
          pytest -q tests/test_bounded_reduction_shapes.py
      - name: Execute non-exact FP32 C11 contract with sanitizers and negative controls
        run: sh scripts/run_reduction_fp32_contract.sh --c11
      - name: Revalidate recorded FP32 numerical contract (no GPU execution)
        run: |
          python examples/reduction_fp32_contract.py --compare tests/golden/proofs/reduction_fp32_c11_record.json tests/golden/proofs/reduction_fp32_cuda_record.json
          pytest -q tests/test_reduction_fp32_contract.py

  paired-fma:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Install proof dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Execute paired separate and FMA C11 variants
        run: sh scripts/run_reduction_fma_variant.sh --c11
      - name: Revalidate paired observations (no GPU execution)
        run: |
          python examples/reduction_fma_variant.py --compare tests/golden/proofs/reduction_fma_c11_record.json tests/golden/proofs/reduction_fma_cuda_record.json
          pytest -q tests/test_reduction_fma_variant.py

  composed-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Install proof dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Execute nonlinear C11 chain with sanitizers and seven negative controls
        run: sh scripts/run_bounded_composed_chain.sh --c11
      - name: Revalidate source-to-chain observations (no GPU execution)
        run: |
          python examples/bounded_composed_chain.py --compare tests/golden/proofs/composed_chain_c11_record.json tests/golden/proofs/composed_chain_cuda_record.json
          pytest -q tests/test_bounded_composed_chain.py

  plan-native-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Install proof dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Execute core-plan-driven C11 dispatch with sanitizers and twelve controls
        run: sh docker/plan-native-bridge/operator.sh --c11
      - name: Revalidate core-plan-to-native observations (no GPU execution)
        run: |
          python examples/bounded_plan_native_bridge.py --compare tests/golden/proofs/plan_native_c11_record.json tests/golden/proofs/plan_native_cuda_record.json
          pytest -q tests/test_bounded_plan_native_bridge.py

  native-io:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Install proof dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Execute planned C11 boundary bindings with sanitizers and twenty controls
        run: sh docker/native-io/operator.sh --c11
      - name: Revalidate recorded native boundary I/O (no GPU execution)
        run: |
          python examples/bounded_native_io.py --compare tests/golden/proofs/native_io_c11_record.json tests/golden/proofs/native_io_cuda_record.json
          pytest -q tests/test_bounded_native_io.py

  mixed-native-residency:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Install proof dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Execute shared-residency C11 path with sanitizers and negative controls
        run: sh docker/mixed-native/operator.sh --c11
      - name: Revalidate recorded mixed native execution (no GPU execution)
        run: |
          python examples/bounded_mixed_native.py --compare tests/golden/proofs/mixed_native_c11_record.json tests/golden/proofs/mixed_native_mixed_record.json
          pytest -q tests/test_runtime_residency.py tests/test_bounded_mixed_native.py

  native-placement-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Install proof dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Execute C11 placement and native contract sanitizer tests
        run: sh docker/native-placements/operator.sh --c11
      - name: Verify all eight compiled placements (no GPU execution)
        run: |
          python examples/bounded_native_placements.py
          python examples/bounded_native_placements.py --compare tests/golden/proofs/native_placements_c11_record.json tests/golden/proofs/native_placements_matrix_record.json
          pytest -q -n 4 tests/test_bounded_native_placements.py

  native-fanout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Install proof dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Execute C11 fanout and native contract sanitizer controls
        run: sh docker/native-fanout/operator.sh --c11
      - name: Verify fixed fanout source, plans and contracts (no GPU execution)
        run: |
          python examples/bounded_native_fanout.py
          python examples/bounded_native_fanout.py --compare tests/golden/proofs/native_fanout_c11_record.json tests/golden/proofs/native_fanout_matrix_record.json
          pytest -q -n 4 tests/test_bounded_native_fanout.py

  native-fanin:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Install proof dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Execute C11 fan-in with sanitizer and operand-readiness controls
        run: sh docker/native-fanin/operator.sh --c11
      - name: Verify fixed fan-in candidate and worker contracts (no GPU execution)
        run: |
          python examples/bounded_native_fanin.py
          python examples/bounded_native_fanin_workers.py
          pytest -q -n 4 tests/test_bounded_native_fanin.py tests/test_bounded_native_fanin_workers.py
