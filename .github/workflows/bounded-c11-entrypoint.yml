name: Bounded C11 graph entrypoint conformance

on:
  pull_request:
  push:
    branches:
      - main
      - "kirchherr/**"

permissions:
  contents: read

concurrency:
  group: bounded-c11-entrypoint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-entrypoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Validate graph entrypoint and build wheel
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pytest -q tests/test_bounded_source.py tests/test_bounded_source_consumer.py tests/test_bounded_c11.py tests/test_bounded_c11_entrypoint_consumer.py
          python -m pip wheel --no-deps --no-build-isolation --no-index . --wheel-dir "$RUNNER_TEMP/c11-entrypoint-wheel"
      - name: Install outside checkout and execute the two-graph client
        run: |
          set -euo pipefail
          unset PYTHONPATH
          python -m venv "$RUNNER_TEMP/c11-entrypoint-env"
          "$RUNNER_TEMP/c11-entrypoint-env/bin/python" -m pip install --require-hashes -r requirements/ci.txt
          "$RUNNER_TEMP/c11-entrypoint-env/bin/python" -m pip install --no-deps --no-index "$RUNNER_TEMP"/c11-entrypoint-wheel/tuc-*.whl
          cp -R integration/bounded_c11_entrypoint "$RUNNER_TEMP/c11-entrypoint-consumer"
          cd "$RUNNER_TEMP/c11-entrypoint-consumer"
          export PATH="$RUNNER_TEMP/c11-entrypoint-env/bin:$PATH"
          python3 -I -c 'import os, pathlib, sys, tuc; root = pathlib.Path(sys.prefix).resolve(); assert pathlib.Path(tuc.__file__).resolve().is_relative_to(root); assert not any(pathlib.Path(p).resolve().is_relative_to(pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()) for p in sys.path if p)'
          python3 -I -c 'import hashlib, os, pathlib; wheels = list((pathlib.Path(os.environ["RUNNER_TEMP"]) / "c11-entrypoint-wheel").glob("tuc-*.whl")); assert len(wheels) == 1; pathlib.Path("wheel-sha256.txt").write_text("sha256:" + hashlib.sha256(wheels[0].read_bytes()).hexdigest() + "\n", encoding="ascii")'
          python3 -I consumer.py
          sh operator.sh --c11
      - name: Retain verified entrypoint receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bounded-c11-entrypoint-receipt
          path: ${{ runner.temp }}/c11-entrypoint-consumer/tmp/bounded-c11-entrypoint.*/record.json
          if-no-files-found: error
          retention-days: 14
