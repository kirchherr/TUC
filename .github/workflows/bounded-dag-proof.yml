name: Bounded DAG C11 conformance

on:
  pull_request:
  push:
    branches:
      - main
      - "kirchherr/**"

permissions:
  contents: read

concurrency:
  group: bounded-dag-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixed-cpu-portfolio:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Install existing pinned dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Validate inert DAG artifacts and bounded conformance protocol
        run: |
          python examples/bounded_dag_compiler.py
          python examples/bounded_dag_c11.py
          pytest -q tests/test_bounded_dag_c11.py
      - name: Execute isolated fixed CPU portfolio and ASan UBSan controls
        run: sh docker/bounded-dag-c11/operator.sh --c11
      - name: Retain verified fixed CPU conformance receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bounded-dag-c11-receipt
          path: tmp/bounded-dag-c11.*/record.json
          if-no-files-found: error
          retention-days: 14
