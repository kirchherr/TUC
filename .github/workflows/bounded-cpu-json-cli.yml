name: Bounded CPU JSON CLI integration

on:
  pull_request:
  push:
    branches:
      - main
      - "kirchherr/**"

permissions:
  contents: read

concurrency:
  group: bounded-cpu-json-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-json-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Validate JSON and file boundaries and build wheel
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pytest -q tests/test_bounded_cpu_json.py tests/test_bounded_cpu_application_cli.py tests/test_bounded_cpu_json_consumer.py tests/test_bounded_c11_application_runtime.py
          python -m pip wheel --no-deps --no-build-isolation --no-index . --wheel-dir "$RUNNER_TEMP/cpu-json-wheel"
      - name: Exercise the installed console with caller-owned graphs and data
        run: |
          set -euo pipefail
          unset PYTHONPATH
          python -m venv "$RUNNER_TEMP/cpu-json-env"
          "$RUNNER_TEMP/cpu-json-env/bin/python" -m pip install --require-hashes -r requirements/ci.txt
          "$RUNNER_TEMP/cpu-json-env/bin/python" -m pip install --no-deps --no-index "$RUNNER_TEMP"/cpu-json-wheel/tuc-*.whl
          cp -R integration/bounded_cpu_json "$RUNNER_TEMP/cpu-json-consumer"
          cd "$RUNNER_TEMP/cpu-json-consumer"
          export PATH="$RUNNER_TEMP/cpu-json-env/bin:$PATH"
          python3 -I -c 'import os,pathlib,sys,tuc; assert pathlib.Path(tuc.__file__).resolve().is_relative_to(pathlib.Path(sys.prefix).resolve()); assert not any(pathlib.Path(p).resolve().is_relative_to(pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()) for p in sys.path if p)'
          tuc-cpu-app --help
          tuc-cpu-app inspect projection.json > projection-inspection.json
          python3 -I consumer.py > candidate.json
          python3 -I consumer.py --run
          python3 -I - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          record = json.loads(Path("record.json").read_text())
          assert record["schema_version"] == "tuc.bounded_cpu_json_integration.v0"
          assert record["status"] == "PASS" and record["native_execution_observed"] is True
          assert record["case_runs"] == 12 and record["numeric_rejections"] == 1
          assert record["scalar_checks"] == 56 and record["negative_controls"] == 6
          wheels = list((Path(os.environ["RUNNER_TEMP"]) / "cpu-json-wheel").glob("tuc-*.whl"))
          assert len(wheels) == 1
          receipt = {"integration": record, "source_commit": os.environ["GITHUB_SHA"],
                     "wheel_sha256": hashlib.sha256(wheels[0].read_bytes()).hexdigest(),
                     "consumer_sha256": hashlib.sha256(Path("consumer.py").read_bytes()).hexdigest()}
          Path("ci-record.json").write_text(json.dumps(receipt, sort_keys=True) + "\n")
          PY
      - name: Retain original CLI execution observations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bounded-cpu-json-cli-receipt
          path: ${{ runner.temp }}/cpu-json-consumer/ci-record.json
          if-no-files-found: error
          retention-days: 14
