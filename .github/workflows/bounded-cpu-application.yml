name: Bounded CPU application integration

on:
  pull_request:
  push:
    branches:
      - main
      - "kirchherr/**"

permissions:
  contents: read

concurrency:
  group: bounded-cpu-application-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-application:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Check boundaries and build wheel
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pytest -q tests/test_bounded_c11.py tests/test_bounded_c11_application.py tests/test_bounded_c11_application_runtime.py tests/test_bounded_cpu_application_consumer.py
          python -m pip wheel --no-deps --no-build-isolation --no-index . --wheel-dir "$RUNNER_TEMP/cpu-application-wheel"
      - name: Execute installed application and sanitizer parser corpus
        run: |
          set -euo pipefail
          unset PYTHONPATH
          python -m venv "$RUNNER_TEMP/cpu-application-env"
          "$RUNNER_TEMP/cpu-application-env/bin/python" -m pip install --require-hashes -r requirements/ci.txt
          "$RUNNER_TEMP/cpu-application-env/bin/python" -m pip install --no-deps --no-index "$RUNNER_TEMP"/cpu-application-wheel/tuc-*.whl
          cp -R integration/bounded_cpu_application "$RUNNER_TEMP/cpu-application-consumer"
          cd "$RUNNER_TEMP/cpu-application-consumer"
          export PATH="$RUNNER_TEMP/cpu-application-env/bin:$PATH"
          python3 -I -c 'import os, pathlib, sys, tuc; assert pathlib.Path(tuc.__file__).resolve().is_relative_to(pathlib.Path(sys.prefix).resolve()); assert not any(pathlib.Path(p).resolve().is_relative_to(pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()) for p in sys.path if p)'
          python3 -I consumer.py > candidate.json
          python3 -I consumer.py --run > application-result.json
          sh fuzz_operator.sh --fuzz
          python3 -I -c 'import hashlib,json,os,pathlib; root=pathlib.Path("."); result=json.loads((root/"application-result.json").read_text()); assert result["native_execution_observed"] is True and result["case_runs"] == 12 and result["scalar_checks"] == 72 and result["numeric_rejections"] == 1; contexts=[pathlib.Path(p) for p in pathlib.Path("contexts.txt").read_text().splitlines()]; assert len(contexts)==2; fuzz=[json.loads((p/"fuzz-result.json").read_text()) for p in contexts]; identities=[json.loads((p/"identity.json").read_text()) for p in contexts]; assert [x["fuzz_cases"] for x in fuzz] == [1368,1092]; assert all(x["status"]=="PASS" and x["program_digest"]==i["program_digest"] for x,i in zip(fuzz,identities,strict=True)); assert {x["program_digest"] for x in fuzz}==set(result["programs"].values()); wheels=list((pathlib.Path(os.environ["RUNNER_TEMP"])/"cpu-application-wheel").glob("tuc-*.whl")); assert len(wheels)==1; record={"application":result,"fuzz":fuzz,"identities":identities,"wheel_sha256":hashlib.sha256(wheels[0].read_bytes()).hexdigest(),"source_commit":os.environ["GITHUB_SHA"]}; pathlib.Path("record.json").write_text(json.dumps(record,sort_keys=True)+"\n")'
      - name: Retain actual application observations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bounded-cpu-application-receipt
          path: ${{ runner.temp }}/cpu-application-consumer/record.json
          if-no-files-found: error
          retention-days: 14
