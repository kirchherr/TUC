name: tuc

x-dev-base: &dev-base
  build:
    context: .
    dockerfile: docker/dev/Dockerfile
    args:
      PYTORCH_INDEX_URL: ${PYTORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
      INSTALL_TORCH: ${INSTALL_TORCH:-1}
  image: tuc-dev:latest
  working_dir: /workspace
  volumes:
    - .:/workspace
  environment: &dev-env
    TUC_IN_CONTAINER: "1"
    PYTHONPATH: /workspace:/workspace/src
    CC: clang-18
    CXX: clang++-18
    LLVM_CONFIG: /usr/bin/llvm-config-18
    LLVM_DIR: /usr/lib/llvm-18/lib/cmake/llvm
    MLIR_DIR: /usr/lib/llvm-18/lib/cmake/mlir
  stdin_open: true
  tty: true

services:
  dev:
    <<: *dev-base
    command: bash

  source-ingestion-worker:
    build:
      context: .
      dockerfile: docker/source-worker/Dockerfile
    image: tuc-source-ingestion-worker:research-v0
    platform: linux/amd64
    network_mode: none
    read_only: true
    user: "10001:10001"
    working_dir: /run/tuc
    environment:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      PYTHONNOUSERSITE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 1g
    cpus: 1.0
    ipc: private
    shm_size: 16m
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1700,uid=10001,gid=10001
    stdin_open: true
    tty: false
    stop_grace_period: 1s

  gpu:
    <<: *dev-base
    profiles:
      - gpu
    gpus: all
    environment:
      <<: *dev-env
      TUC_ENABLE_GPU: "1"
    command: bash
