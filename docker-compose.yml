        TUC_GPU_OBSERVATION_HEADER_DIGEST: sha256:d200ef8f2898f8b5cc021ba9dc59bd21aff743f016c0b8304b1f05b5b49c6477
        TUC_GPU_OBSERVATION_SOURCE_DIGEST: sha256:2a5a7bab75bb3c2185f844c54deeecc36f914087a7d71d819657529bab5193e3
        TUC_GPU_OBSERVATION_WORKLOAD_DIGEST: sha256:b4db50ff9a90d776b5028e902d1528ef09bdca945a4d7d8166850e87e72cb1c0
    image: tuc-gpu-observation-sm86:research-v0
    platform: linux/amd64
    pull_policy: never
    network_mode: none
    read_only: true
    user: "10001:10001"
    working_dir: /run/tuc
    environment:
      CUDA_CACHE_DISABLE: "1"
      CUDA_DISABLE_PTX_JIT: "1"
      CUDA_VISIBLE_DEVICES: "0"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      NVIDIA_DRIVER_CAPABILITIES: compute
      NVIDIA_VISIBLE_DEVICES: "0"
    cap_drop:
